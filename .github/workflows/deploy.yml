name: Deploy Corona Real to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Authenticate Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Create resources if missing and configure real D1 ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list --json | grep -q '"name"[[:space:]]*:[[:space:]]*"corona-real"'; then
            npx wrangler r2 bucket create corona-real
          fi
          if ! npx wrangler d1 list --json | grep -q '"name"[[:space:]]*:[[:space:]]*"corona-real-db"'; then
            npx wrangler d1 create corona-real-db
          fi
          DB_ID="$(npx wrangler d1 list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const a=JSON.parse(s); const x=a.find(v=>v.name==="corona-real-db");
              if(!x || !x.uuid) process.exit(2);
              process.stdout.write(x.uuid);
            });')"
          test -n "$DB_ID"
          # Replace only the deployment-time marker; never commit a fabricated ID.
          sed "s/INJECTED_DURING_DEPLOY/$DB_ID/" wrangler.toml > wrangler.deploy.toml
          mv wrangler.deploy.toml wrangler.toml
          npx wrangler d1 execute corona-real-db --remote --file=migrations/0001_initial.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          test -n "$API_ADMIN_TOKEN" || (echo "Missing API_ADMIN_TOKEN secret" && exit 1)
          npx wrangler secret put API_ADMIN_TOKEN <<< "$API_ADMIN_TOKEN"
          npx wrangler deploy
